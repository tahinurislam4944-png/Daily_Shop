<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eff8ed"><title>Daily Shop · Admin</title><link rel="stylesheet" href="/admin.css"></head><body><div class="shell"><aside class="sidebar"><a class="brand" href="/">🌿 Daily Shop<small>ADMIN STUDIO</small></a><nav><button data-view="overview" class="active">▦ Overview</button><button data-view="products">▤ Products</button><button data-view="orders">▣ Orders</button><button data-view="inventory">▥ Inventory</button><button data-view="analytics">◷ Analytics</button></nav><div class="side-bottom"><a href="/">← View storefront</a><button id="logout" class="hidden">Sign out</button></div></aside><main class="main"><header><div><p class="eyebrow">DAILY SHOP CONTROL CENTRE</p><h1 id="pageTitle">Overview</h1></div><span id="adminName"></span></header><section id="loginPanel" class="panel login"><h2>Admin sign in</h2><form id="loginForm"><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="primary">Sign in securely</button><p id="loginError" class="error"></p></form></section><div id="app" class="hidden"><section id="overview" class="view"><div class="stats" id="stats"></div><div class="columns"><section class="panel"><h2>Recent orders</h2><div id="recentOrders"></div></section><section class="panel"><h2>Low stock alerts</h2><div id="lowStock"></div></section></div></section><section id="products" class="view hidden"><div class="toolbar"><p>Manage live storefront catalogue.</p><button class="primary" id="addProduct">+ Add product</button></div><div class="panel table-wrap" id="productTable"></div></section><section id="orders" class="view hidden"><div class="toolbar"><p>Update order fulfilment.</p><select id="orderFilter"><option value="">All orders</option><option>pending</option><option>confirmed</option><option>processing</option><option>shipped</option><option>delivered</option><option>cancelled</option></select></div><div class="panel table-wrap" id="orderTable"></div></section><section id="inventory" class="view hidden"><div class="panel table-wrap" id="inventoryTable"></div></section><section id="analytics" class="view hidden"><div class="panel"><h2>Paid sales · last 7 days</h2><div id="dailyChart" class="bars"></div></div><div class="columns"><section class="panel"><h2>Top products</h2><div id="topProducts"></div></section><section class="panel"><h2>Category demand</h2><div id="categoryDemand"></div></section></div></section></div></main></div><dialog id="productDialog"><form id="productForm"><div class="dialog-head"><h2 id="productDialogTitle">Add product</h2><button type="button" class="close" id="closeProduct">×</button></div><input type="hidden" name="id"><div class="form-grid"><label>Name<input name="name" required maxlength="180"></label><label>Category<input name="category" required maxlength="80"></label><label>Price (৳)<input name="price" type="number" min="0" step=".01" required></label><label>Unit<input name="unit" required placeholder="1 kg"></label><label>Stock<input name="stock" type="number" min="0" required></label><label>Emoji<input name="emoji" maxlength="12" value="🛒"></label><label>Badge<input name="badge" maxlength="50"></label><label>Image URL<input name="image_url" type="url"></label><label class="wide">Description<textarea name="description" maxlength="2000"></textarea></label><label class="check"><input name="is_active" type="checkbox" checked> Visible in storefront</label></div><button class="primary" type="submit">Save product</button><p id="productError" class="error"></p></form></dialog><script src="/admin.js"></script></body></html>
